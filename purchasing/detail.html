<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase order · Centennial Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .title-row .page-title { margin: 0 var(--space-2) 0 0; }
    .meta { margin: var(--space-1) 0 0; color: var(--color-text-secondary); }
    .po-doc-head { display: flex; justify-content: space-between; margin-bottom: var(--space-4); }
    .po-doc-head img { height: 36px; width: auto; }
    .po-doc-head p { margin: 0; text-align: right; }
    .po-parties { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4); font-size: var(--text-small); }
    .po-parties p { margin: 0; }
    .po-sign { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-7); margin-top: var(--space-7); font-size: var(--text-small); }
    .po-sign div { padding-top: var(--space-2); border-top: 1px solid var(--color-text); }
    .sum-row td { font-weight: 800; border-top: 1.5px solid var(--color-text); }
  </style>
</head>
<body>
  <!-- 4.3 Issue Purchase Order (printable) · links to 4.4 receiving and 4.5 payables -->
  <main id="main">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="../dashboard.html">Home</a></li><li><a href="list.html">Purchasing &amp; Suppliers</a></li><li><span aria-current="page" id="crumb"></span></li></ol>
    </nav>
    <div class="page-head no-print">
      <div>
        <div class="title-row"><h1 class="page-title" id="title"></h1><span id="status"></span><span id="payment"></span></div>
        <p class="meta" id="meta"></p>
      </div>
      <div class="page-head__actions" id="actions"></div>
    </div>
    <div id="notes" class="no-print"></div>

    <!-- The purchase order document; prints on its own -->
    <article class="card card--pad" aria-label="Purchase order document">
      <div class="po-doc-head print-only"><img src="../assets/img/logo.jpg" alt="Centennial N&amp;S Construction Corporation"><div><p><strong>PURCHASE ORDER</strong></p><p id="doc-no"></p><p id="doc-date"></p></div></div>
      <div class="po-parties" id="parties"></div>
      <div class="table-wrap"><table class="table" id="lines"></table></div>
      <div class="po-sign print-only"><div id="sign-prepared"></div><div id="sign-approved"></div></div>
    </article>
  </main>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/history.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/po-actions.js"></script>
  <script>
    (function () {
      var R = CNS.ROLES;
      var session = CNS.layout.desktop({ active: 'purchasing' });
      if (!session) return;
      var S = CNS.store, P = CNS.poActions, fmt = CNS.format, esc = CNS.escape;
      var $ = function (id) { return document.getElementById(id); };
      var me = session.user;
      var po = S.get('purchase_orders', new URLSearchParams(location.search).get('id'));
      if (!po) { location.replace('list.html'); return; }

      function userName(id) { var u = id && S.get('users', id); return u ? u.full_name : '—'; }

      function render() {
        po = S.get('purchase_orders', po.id);
        var s = S.get('suppliers', po.supplier_id), b = S.get('branches', po.branch_id);
        document.title = po.po_no + ' · Centennial Sales & Inventory';
        $('crumb').textContent = po.po_no;
        $('title').textContent = po.po_no;
        $('status').innerHTML = P.statusBadge(po.status);
        $('payment').innerHTML = P.paymentBadge(po.payment_status);
        $('meta').textContent = s.company_name + ' · ' + S.branchName(po.branch_id) + ' · Requested ' + fmt.date(po.date) + ' by ' + userName(po.requested_by) + ' · Expected ' + fmt.date(po.expected_date);
        $('doc-no').textContent = 'No. ' + po.po_no;
        $('doc-date').textContent = 'Date: ' + fmt.date(po.date);

        // One primary action per status
        var a = '';
        if (po.status === 'For approval' && me.role === R.OM && po.branch_id === me.branch_id) a += '<a class="btn btn--primary" href="approvals.html?id=' + encodeURIComponent(po.id) + '">' + CNS.icon('check-circle') + 'Review for approval</a>';
        if (po.status === 'Approved') a += '<button type="button" class="btn btn--primary" id="issue">' + CNS.icon('printer') + 'Issue purchase order</button>';
        if (['Ordered', 'Partially received', 'Received'].indexOf(po.status) >= 0) a = '<button type="button" class="btn btn--secondary" id="print">' + CNS.icon('printer') + 'Print</button>' + a;
        if (me.role === R.OM && po.branch_id === me.branch_id && po.payment_status === 'Unpaid' && ['Ordered', 'Partially received', 'Received'].indexOf(po.status) >= 0)
          a += '<button type="button" class="btn btn--secondary" id="pay">' + CNS.icon('banknotes') + 'Mark paid</button>';
        if (['Ordered', 'Partially received'].indexOf(po.status) >= 0) a += '<a class="btn btn--primary" href="receive.html?id=' + encodeURIComponent(po.id) + '">' + CNS.icon('arrow-down-tray') + 'Receive delivery</a>';
        $('actions').innerHTML = a;

        var notes = [];
        if (po.note) notes.push(['info', 'Note: ' + po.note]);
        if (po.status === 'Approved') notes.push(['info', 'Approved by ' + userName(po.approved_by) + '. Issue the purchase order to send it to the supplier.']);
        $('notes').innerHTML = notes.map(function (n) { return '<p class="alert" data-tone="' + n[0] + '">' + esc(n[1]) + '</p>'; }).join('');

        $('parties').innerHTML = '<p><span class="cell-sub">Supplier</span><br><strong>' + esc(s.company_name) + '</strong><br>' + esc(s.address) + '<br>' + esc(s.contact_person + ' · ' + s.contact_no) + '</p>' +
          '<p><span class="cell-sub">Deliver to</span><br><strong>' + esc(b ? b.name : '') + '</strong><br>Expected ' + esc(fmt.date(po.expected_date)) + '</p>';
        var items = P.items(po.id);
        $('lines').innerHTML = '<thead><tr><th scope="col">Product</th><th scope="col" class="num-col">Ordered</th><th scope="col">= Selling units</th>' +
          '<th scope="col" class="num-col">Received</th><th scope="col" class="num-col">Unit cost</th><th scope="col" class="num-col">Amount</th></tr></thead><tbody>' +
          items.map(function (it) {
            var p = S.get('products', it.product_id), l = P.link(p.id, po.supplier_id), unit = l ? l.purchase_unit : 'unit';
            return '<tr><td class="cell-main">' + esc(p.name) + '</td><td class="num-col nowrap">' + esc(fmt.count(it.qty_ordered, unit)) + '</td>' +
              '<td class="nowrap">' + esc(fmt.qty(it.qty_ordered * (l ? l.conversion : 1), p.unit_id)) + '</td>' +
              '<td class="num-col nowrap">' + fmt.number(it.qty_received) + ' of ' + fmt.number(it.qty_ordered) + '</td>' +
              '<td class="num-col">' + esc(fmt.money(it.unit_cost)) + '</td><td class="num-col">' + esc(fmt.money(it.qty_ordered * it.unit_cost)) + '</td></tr>';
          }).join('') + '<tr class="sum-row"><td colspan="5">Total</td><td class="num-col">' + esc(fmt.money(P.total(po.id))) + '</td></tr></tbody>';
        $('sign-prepared').textContent = 'Prepared by: ' + userName(po.requested_by);
        $('sign-approved').textContent = 'Approved by: ' + userName(po.approved_by);

        if ($('issue')) $('issue').addEventListener('click', function () {
          P.issue(po, session);
          render();
          CNS.ui.toast(po.po_no + ' issued. Send the printed order to the supplier.');
          window.print();
        });
        if ($('print')) $('print').addEventListener('click', function () { window.print(); });
        if ($('pay')) $('pay').addEventListener('click', function () {
          CNS.ui.confirm({ title: 'Mark ' + po.po_no + ' as paid?', body: fmt.money(P.total(po.id)) + ' to ' + s.company_name + '. Only after checking the supplier\'s invoice.', confirm: 'Mark paid', icon: 'banknotes' })
            .then(function (ok) { if (ok) { P.markPaid(po, session); render(); CNS.ui.toast(po.po_no + ' marked paid.'); } });
        });
      }
      render();
    })();
  </script>
</body>
</html>
