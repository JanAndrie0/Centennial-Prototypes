<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock check · Centennial Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <!-- 3.3 Check Stock Availability: the agent's answer to "may stock pa ba?" without calling the office. View only. -->
  <main id="main">
    <h1 class="page-title">Stock check</h1>
    <p class="page-desc">Is it in stock? Search a product.</p>

    <form role="search" aria-label="Stock check" onsubmit="return false">
      <div class="search">
        <label class="sr-only" for="q">Product name or code</label>
        <span id="search-icon"></span>
        <input class="input" type="search" id="q" placeholder="e.g. epoxy, teflon" autocomplete="off" enterkeyhint="search">
      </div>
    </form>
    <p class="result-count" id="status" role="status"></p>
    <ul class="stock-cards" id="results"></ul>
  </main>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/format.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/history.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/stock-check.js"></script>
  <script>
    (function () {
      var session = CNS.layout.mobile({ active: 'stock' });
      if (!session) return;
      var $ = function (id) { return document.getElementById(id); };

      $('search-icon').outerHTML = CNS.icon('magnifying-glass');
      // Coming from the quick search on Home: start with that word
      $('q').value = new URLSearchParams(location.search).get('q') || '';
      // Agents see their own branch, plus where else the item is available
      CNS.stockCheck.mount({
        input: $('q'), results: $('results'), status: $('status'), linkToDetail: false,
        branch: function () { return session.user.branch_id; }
      });
    })();
  </script>
</body>
</html>
