<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Centennial Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <style>
    .banner-link { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); text-decoration: none; }
    .banner-link .alert { flex: 1; margin: 0; }
    /* Hover lift and press come from the shared a.stat rules in components.css (ADR-006) */
    a.stat { display: block; color: inherit; text-decoration: none; }
    a.stat:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .trend { font-weight: 600; }
    .trend--up { color: var(--color-success); }
    .trend--down { color: var(--color-warning); }
    /* Management layout (user's reference, Oct 26): 2×2 key numbers beside the week's sales line,
       then top selling products beside sales by category */
    .dash-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5); margin-bottom: var(--space-5); }
    .dash-mid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; margin-bottom: var(--space-5); }
    .top-products .table-wrap { margin: 0 calc(-1 * var(--space-5)) calc(-1 * var(--space-5)); border: 0; border-top: 1px solid var(--color-border); border-radius: 0 0 var(--radius-lg) var(--radius-lg); box-shadow: none; }
    .top-products .rank { width: 2.5em; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
    .trend__arrow { font-size: 0.85em; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-5); }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-3); }
    .card-head h2 { margin: 0; font-size: var(--text-card-title); }
    .card-head a { font-size: var(--text-small); font-weight: 600; color: var(--color-primary); text-underline-offset: 3px; }
    .big-num { margin: 0 0 var(--space-2); font-size: var(--text-kpi); font-weight: 700; font-variant-numeric: tabular-nums; }
    .mini { margin: 0; padding: 0; list-style: none; }
    .mini li { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border-subtle); font-size: var(--text-note); }
    .mini li:last-child { border-bottom: 0; }
    .mini li > :last-child { flex: none; white-space: nowrap; }
    .mini li > :last-child:not(.badge) { color: var(--color-text-secondary); } /* badges keep their tone color */
    .mini a { color: var(--color-text); font-weight: 600; text-decoration: none; }
    .mini a:hover { color: var(--color-primary); text-decoration: underline; text-underline-offset: 3px; }
    /* Whole row is the link: 48px tap target, count + chevron on the right */
    .approve-list li { display: block; padding: 0; }
    .mini.approve-list li > a { color: var(--color-text); }
    .approve-list a { display: flex; align-items: center; gap: var(--space-3); min-height: 48px; padding: 0 var(--space-2); margin: 0 calc(-1 * var(--space-2)); border-radius: var(--radius-sm); }
    .approve-list a:hover { background: var(--color-bg); text-decoration: none; }
    .approve-list a:hover .approve-list__label { text-decoration: underline; text-underline-offset: 3px; }
    .approve-list a:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
    .approve-list__label { flex: 1; }
    .approve-list .count { min-width: 32px; padding: 2px 8px; font-weight: 700; text-align: center; border-radius: var(--radius-full); color: var(--color-text-secondary); background: var(--color-border-subtle); }
    .approve-list .count.has { color: var(--color-surface); background: var(--color-primary); }
    .approve-list .icon { width: 18px; height: 18px; color: var(--color-text-secondary); }
    @media (max-width: 1100px) { .dash-top, .dash-mid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- Each role's home screen (dashboards.md): management KPIs and charts, or the warehouse work list. Built last; summarises the modules. -->
  <main id="main">
    <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><span aria-current="page">Home</span></li></ol></nav>
    <h1 class="page-title">Dashboard</h1>
    <p class="page-desc" id="greeting"></p>
    <div id="banner"></div>
    <div id="content"></div>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/chart.js"></script>
  <script src="assets/js/order-actions.js"></script>
  <script src="assets/js/po-actions.js"></script>
  <script src="assets/js/payment-actions.js"></script>
  <script>
    (function () {
      var session = CNS.layout.desktop({ active: 'dashboard' });
      if (!session) return;
      var R = CNS.ROLES, S = CNS.store, fmt = CNS.format, esc = CNS.escape, Pay = CNS.payActions, P = CNS.poActions, A = CNS.orderActions;
      var $ = function (id) { return document.getElementById(id); };
      var me = session.user;
      var BILLED = ['Approved', 'For delivery', 'Shipped', 'Completed'];   // a sale counts once the order is approved (2.4)

      function scope() { return CNS.auth.canSwitchBranch(me) ? session.branchView : me.branch_id; }
      function inScope(branchId) { return scope() === 'all' || branchId === scope(); }
      function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
      function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
      function salesOn(day) {
        return S.where('sales_orders', function (o) { return o.order_date === day && BILLED.indexOf(o.status) >= 0 && inScope(o.branch_id); })
          .reduce(function (t, o) { return t + S.orderTotal(o.id); }, 0);
      }
      function banner(tone, text, href, cta) {
        $('banner').innerHTML = text ? '<a class="banner-link" href="' + href + '"><p class="alert" data-tone="' + tone + '">' + esc(text) + ' <strong>' + esc(cta) + ' →</strong></p></a>' : '';
      }
      function card(title, link, linkText, body) {
        return '<section class="card card--pad" aria-label="' + esc(title) + '"><div class="card-head"><h2>' + esc(title) + '</h2>' +
          (link ? '<a href="' + link + '">' + esc(linkText) + '</a>' : '') + '</div>' + body + '</section>';
      }
      function mini(items, empty) {
        return items.length ? '<ul class="mini">' + items.join('') + '</ul>' : '<p class="cell-sub" style="margin:0">' + esc(empty) + '</p>';
      }

      // ---------------- Management: CEO, Office Manager, Sales Supervisor ----------------
      function management() {
        var today = S.today(), yesterday = addDays(-1), sc = scope();
        var salesToday = salesOn(today), salesYesterday = salesOn(yesterday);
        var ordersToday = S.where('sales_orders', function (o) { return o.order_date === today && o.status !== 'Draft' && inScope(o.branch_id); }).length;
        var low = S.lowStock(sc);
        var overdue = Pay.overdueRows(sc);
        var overdueAmt = overdue.reduce(function (t, x) { return t + (x.schedule.amount_due - x.schedule.amount_paid); }, 0);
        var overdueStores = overdue.map(function (x) { return x.client.id; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).length;

        // The Office Manager's own queue (their branch)
        var isOM = me.role === R.OM, ob = me.branch_id;
        var q = {
          orders: S.where('sales_orders', function (o) { return o.status === 'For approval' && o.branch_id === ob; }).length,
          pos: S.where('purchase_orders', function (p) { return p.status === 'For approval' && p.branch_id === ob; }).length,
          payables: S.where('purchase_orders', function (p) { return p.branch_id === ob && p.payment_status === 'Unpaid' && ['Ordered', 'Partially received', 'Received'].indexOf(p.status) >= 0; }).length,
          verify: Pay.toVerify(ob).length
        };
        var waiting = q.orders + q.pos + q.verify;

        // One banner: the most urgent thing
        if (isOM && waiting) banner('warning', waiting + (waiting === 1 ? ' item is' : ' items are') + ' waiting for your approval.', q.orders ? 'orders/approvals.html' : q.pos ? 'purchasing/approvals.html' : 'payments/receivables.html', 'Review');
        else if (overdueStores) banner('error', overdueStores + (overdueStores === 1 ? ' customer is' : ' customers are') + ' overdue (' + fmt.money(overdueAmt) + ').', 'payments/receivables.html', 'Open receivables');
        else if (low.length) banner('warning', low.length + (low.length === 1 ? ' product is' : ' products are') + ' low on stock.', 'products/reorder.html', 'Open reorder list');
        else banner();

        // Change against yesterday: a pill beside the number (arrow + amount, direction in words for screen readers)
        // and a short sub line saying what it compares with. Money as a percent; small counts as a difference.
        function pill(up, text) {
          return '<span class="trend-pill trend-pill--' + (up ? 'up' : 'down') + '"><span aria-hidden="true">' + (up ? '▲' : '▼') + '</span>' +
            '<span class="sr-only">' + (up ? 'Up ' : 'Down ') + '</span>' + text + '</span>';
        }
        function moneyChange(now, before) {
          if (!before) return now ? { pill: pill(true, 'New'), sub: 'None yesterday' } : { pill: '', sub: 'None yesterday either' };
          var p = Math.round((now - before) / before * 100);
          return p ? { pill: pill(p > 0, Math.abs(p) + '%'), sub: 'vs yesterday' } : { pill: '', sub: 'Same as yesterday' };
        }
        function countChange(now, before) {
          var d = now - before;
          return d ? { pill: pill(d > 0, String(Math.abs(d))), sub: (d > 0 ? 'More' : 'Fewer') + ' than yesterday' } : { pill: '', sub: 'Same as yesterday' };
        }
        // One icon tile: label, number (+ pill), sub line, tinted icon circle on the right
        function tile(href, tone, label, value, chg, sub, icon, iconTone) {   // iconTone: the circle's colour when the card has no tone
          return '<a class="stat stat--icon' + (tone ? ' stat--' + tone : '') + '" href="' + href + '">' +
            '<p class="stat__label">' + esc(label) + '</p>' +
            '<div class="stat__value-row"><p class="stat__value">' + esc(value) + '</p>' + (chg ? chg.pill : '') + '</div>' +
            '<p class="stat__sub">' + esc(chg ? chg.sub : sub) + '</p>' +
            '<span class="stat__icon stat__icon--' + (tone || iconTone || 'info') + '" aria-hidden="true">' + CNS.icon(icon) + '</span></a>';
        }
        var ordersYesterday = S.where('sales_orders', function (o) { return o.order_date === yesterday && o.status !== 'Draft' && inScope(o.branch_id); }).length;
        var lowBy = { 'backordered': 0, 'below-floor': 0, 'low': 0 };
        low.forEach(function (p) { lowBy[S.stockStatus(p.id, sc)]++; });
        var lowSub = [[lowBy.backordered, 'backordered'], [lowBy['below-floor'], 'below floor'], [lowBy.low, 'low']]
          .filter(function (x) { return x[0]; }).map(function (x) { return x[0] + ' ' + x[1]; }).join(' · ') || 'All above the reorder point';
        var oldest = overdue.length ? overdue[0].days : 0;   // overdueRows is sorted oldest first

        // Sales line: the last 7 days (today last) against the same days one week earlier
        var labels = [], titles = [], cur = [], prev = [];
        for (var i = 6; i >= 0; i--) {
          var d = addDays(-i), dp = addDays(-i - 7);
          labels.push(i === 0 ? 'Today' : fmt.toDate(d).toLocaleDateString('en-US', { weekday: 'short' }));
          titles.push(fmt.toDate(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + (i === 0 ? ' (today)' : ''));
          cur.push(salesOn(d));
          prev.push(salesOn(dp));
        }
        var sum = function (a) { return a.reduce(function (t, v) { return t + v; }, 0); };
        var curTotal = sum(cur), prevTotal = sum(prev);

        // Last 30 days by category and by product
        var since = addDays(-30), byCat = {}, byProd = {};
        S.where('sales_orders', function (o) { return o.order_date >= since && BILLED.indexOf(o.status) >= 0 && inScope(o.branch_id); }).forEach(function (o) {
          S.where('sales_order_items', function (it) { return it.order_id === o.id; }).forEach(function (it) {
            var p = S.get('products', it.product_id), c = S.get('categories', p.category_id), amt = it.qty * it.unit_price;
            byCat[c.name] = (byCat[c.name] || 0) + amt;
            var g = byProd[p.id] = byProd[p.id] || { p: p, cat: c.name, qty: 0, amt: 0, orders: {} };
            g.qty += it.qty; g.amt += amt; g.orders[o.id] = true;
          });
        });
        // Donut: the 4 biggest categories, the rest folded into "Other" (8 thin slices are hard to compare)
        var cats = Object.keys(byCat).map(function (k) { return { label: k, value: byCat[k] }; }).sort(function (a, b) { return b.value - a.value; });
        if (cats.length > 5) cats = cats.slice(0, 4).concat([{ label: 'Other (' + (cats.length - 4) + ' categories)', value: sum(cats.slice(4).map(function (c) { return c.value; })), other: true }]);
        var top = Object.keys(byProd).map(function (k) { return byProd[k]; }).sort(function (a, b) { return b.amt - a.amt; }).slice(0, 5);

        $('content').innerHTML =
          '<div class="dash-top">' +
            '<section class="stats stats--2x2" aria-label="Key numbers">' +
              tile('orders/list.html', '', 'Sales today', fmt.money(salesToday), moneyChange(salesToday, salesYesterday), '', 'banknotes', 'success') +   // light green, like money (user, Oct 26)
              tile('orders/list.html', '', 'Orders today', String(ordersToday), countChange(ordersToday, ordersYesterday), '', 'clipboard-document-list') +
              tile('products/reorder.html', low.length ? 'warning' : '', 'Low-stock items', String(low.length), null, lowSub, 'cube') +
              tile('payments/receivables.html#view=overdue', overdueAmt ? 'error' : '', 'Overdue balances', fmt.money(overdueAmt), null,
                overdueStores ? overdueStores + (overdueStores === 1 ? ' customer' : ' customers') + ' · oldest ' + oldest + (oldest === 1 ? ' day' : ' days') : 'No overdue customers', 'exclamation-circle') +
            '</section>' +
            '<section class="card card--pad" id="chart-week"></section>' +
          '</div>' +
          '<div class="dash-mid">' +
            '<section class="card card--pad top-products" aria-labelledby="top-title"><div class="card-head"><h2 id="top-title">Top selling products · 30 days</h2><a href="reports/view.html?type=sales&amp;view=product&amp;preset=last30">See report</a></div>' +
              (top.length
                ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col" class="rank">#</th><th scope="col">Product</th><th scope="col" class="num-col">Sold</th><th scope="col" class="num-col">Orders</th><th scope="col" class="num-col">Sales</th></tr></thead><tbody>' +
                  top.map(function (g, i) {
                    return '<tr><td class="rank">' + (i + 1) + '</td><td><a class="row-link" href="products/detail.html?id=' + encodeURIComponent(g.p.id) + '">' + esc(g.p.name) + '</a><span class="cell-sub">' + esc(g.cat) + '</span></td>' +
                      '<td class="num-col nowrap">' + esc(fmt.qty(g.qty, g.p.unit_id)) + '</td><td class="num-col">' + Object.keys(g.orders).length + '</td><td class="num-col cell-main">' + esc(fmt.money(g.amt)) + '</td></tr>';
                  }).join('') + '</tbody></table></div>'
                : '<p class="cell-sub" style="margin:0">No sales in the last 30 days.</p>') +
            '</section>' +
            '<section class="card card--pad" id="chart-cats"></section>' +
          '</div>' +
          (isOM ? card('Waiting for your approval', null, '', '<ul class="mini approve-list">' +
            [['Sales orders (2.3)', q.orders, 'orders/approvals.html'], ['Purchase requests (4.2)', q.pos, 'purchasing/approvals.html'],
             ['Field payments to verify (5.3)', q.verify, 'payments/receivables.html'], ['Supplier payables to check (4.5)', q.payables, 'purchasing/list.html?payment=Unpaid']]
              .map(function (r) { return '<li><a href="' + r[2] + '"><span class="approve-list__label">' + esc(r[0]) + '</span><span class="count' + (r[1] ? ' has' : '') + '">' + r[1] + '<span class="sr-only"> waiting</span></span>' + CNS.icon('chevron-right') + '</a></li>'; }).join('') + '</ul>') : '');

        var weekChange = prevTotal ? Math.round((curTotal - prevTotal) / prevTotal * 100) : null;
        CNS.chart.line($('chart-week'), {
          title: 'Sales, last 7 days', label: 'Sales per day for the last 7 days and the same days one week earlier', format: fmt.money,
          labels: labels, titles: titles, hi: 6, empty: 'No sales in the last two weeks.',
          series: [{ label: 'Last 7 days', tipLabel: 'This day', values: cur, total: curTotal },
                   { label: 'Week before', tipLabel: 'Same day, week before', values: prev, total: prevTotal, muted: true }],
          note: weekChange === null || !weekChange ? '' : '<span class="trend trend--' + (weekChange > 0 ? 'up' : 'down') + '"><span class="trend__arrow" aria-hidden="true">' + (weekChange > 0 ? '▲' : '▼') + '</span>' +
            '<span class="sr-only">' + (weekChange > 0 ? 'Up' : 'Down') + '</span> ' + Math.abs(weekChange) + '%</span> vs the week before'
        });
        CNS.chart.donut($('chart-cats'), cats, { title: 'Sales by category · 30 days', label: 'Sales by category for the last 30 days', format: fmt.money,
          centerLabel: 'Total, 30 days', empty: 'No sales in the last 30 days.', link: { href: 'reports/view.html?type=sales&view=category&preset=last30', text: 'See report' } });
      }

      // ---------------- Admin / Warehouse Staff ----------------
      function warehouse() {
        var sc = scope(), today = S.today(), weekEnd = addDays(7);
        var toPack = S.where('sales_orders', function (o) { return ['Approved', 'For delivery'].indexOf(o.status) >= 0 && inScope(o.branch_id); })
          .sort(function (a, b) { return a.delivery_date < b.delivery_date ? -1 : 1; });
        var thisWeek = toPack.filter(function (o) { var d = A.deliveryFor(o.id); return (d ? d.schedule_date : o.delivery_date) <= weekEnd; });
        var deliveriesToday = S.where('deliveries', function (d) { var o = S.get('sales_orders', d.order_id); return d.schedule_date === today && o && inScope(o.branch_id); });
        var low = S.lowStock(sc);
        var incoming = S.where('purchase_orders', function (p) { return ['Ordered', 'Partially received'].indexOf(p.status) >= 0 && inScope(p.branch_id); });
        var due = Pay.dueSoon(7, sc);

        if (deliveriesToday.length) banner('info', deliveriesToday.length + (deliveriesToday.length === 1 ? ' delivery goes out today.' : ' deliveries go out today.'), 'deliveries/load-list.html?date=' + today, 'Truck load list');
        else if (low.length) banner('warning', low.length + (low.length === 1 ? ' product is' : ' products are') + ' low on stock.', 'products/reorder.html', 'Open reorder list');
        else banner();

        function storeName(o) { var c = S.get('clients', o.client_id); return c ? c.store_name : ''; }
        function sd(d) { return fmt.date(d).replace(/, \d{4}$/, ''); }   // "Oct 27": these lists are all within a week or two
        $('content').innerHTML = '<div class="cards">' +
          card('Orders to pack', 'deliveries/list.html', 'Deliveries', '<p class="big-num">' + toPack.length + '</p><p class="cell-sub" style="margin:0 0 var(--space-2)">' + thisWeek.length + ' due this week</p>' +
            mini(toPack.slice(0, 5).map(function (o) {
              return '<li><a href="orders/detail.html?id=' + encodeURIComponent(o.id) + '">' + esc(o.order_no) + ' · ' + esc(storeName(o)) + '</a><span>' + esc(sd(o.delivery_date)) + '</span></li>';
            }), 'Nothing to pack.')) +
          card('Deliveries today', 'deliveries/load-list.html?date=' + today, 'Truck load list', '<p class="big-num">' + deliveriesToday.length + '</p>' +
            mini(deliveriesToday.map(function (d) {
              var o = S.get('sales_orders', d.order_id), t = S.get('trucks', d.truck_id);
              return '<li><a href="deliveries/detail.html?id=' + encodeURIComponent(d.id) + '">' + esc(o.order_no + ' · ' + storeName(o)) + '</a><span>' + esc((t ? t.name + ' · ' : '') + d.status) + '</span></li>';
            }), 'No deliveries scheduled today.')) +
          card('Low stock', 'products/reorder.html', 'Reorder list', '<p class="big-num">' + low.length + '</p>' +
            mini(low.slice(0, 5).map(function (p) {
              return '<li><a href="products/detail.html?id=' + encodeURIComponent(p.id) + '">' + esc(p.name) + '</a>' + CNS.ui.stockBadge(S.stockStatus(p.id, sc)) + '</li>';
            }), 'Everything is above its reorder point.')) +
          card('Supplier deliveries to receive', 'purchasing/receive.html', 'Receive', '<p class="big-num">' + incoming.length + '</p>' +
            mini(incoming.map(function (p) {
              return '<li><a href="purchasing/receive.html?id=' + encodeURIComponent(p.id) + '">' + esc(p.po_no + ' · ' + S.get('suppliers', p.supplier_id).company_name) + '</a><span>' + esc('Expected ' + sd(p.expected_date)) + '</span></li>';
            }), 'Nothing on the way from suppliers.')) +
          card('Due-date reminders (7 days)', 'payments/receivables.html', 'Receivables', '<p class="big-num">' + due.length + '</p>' +
            mini(due.slice(0, 5).map(function (x) {
              return '<li><a href="customers/detail.html?id=' + encodeURIComponent(x.client.id) + '#view=installments">' + esc(x.client.store_name) + '</a><span>' + esc(fmt.money(x.schedule.amount_due - x.schedule.amount_paid) + ' · ' + sd(x.schedule.due_date)) + '</span></li>';
            }), 'No installments due this week.')) +
          '</div>';
      }

      function render() {
        $('greeting').textContent = 'Welcome, ' + me.full_name + ' · ' + S.branchName(scope());
        if (me.role === R.STAFF) warehouse(); else management();
      }
      document.addEventListener('cns:branchchange', function (e) { session.branchView = e.detail.branchView; render(); });
      render();
    })();
  </script>
</body>
</html>
