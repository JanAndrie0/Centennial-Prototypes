<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Centennial Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
  <main id="main">
    <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><span aria-current="page">Home</span></li></ol></nav>
    <h1 class="page-title">Dashboard</h1>
    <p class="page-desc" id="greeting">Your home screen.</p>

    <!-- Dashboards are built last (plan 00 §4); this placeholder keeps login routing and the shell testable. -->
    <section class="card empty" aria-labelledby="empty-title">
      <span id="empty-icon"></span>
      <h2 class="empty__title" id="empty-title">Dashboard coming soon</h2>
      <p class="empty__text">Open a module from the menu on the left.</p>
    </section>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (function () {
      var session = CNS.layout.desktop({ active: 'dashboard' });
      if (!session) return;
      document.getElementById('greeting').textContent = 'Welcome, ' + session.user.full_name + '.';
      document.getElementById('empty-icon').outerHTML = CNS.icon('squares-2x2');
    })();
  </script>
</body>
</html>
